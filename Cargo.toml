[workspace]
resolver = "2"
members = [
    "crates/oryq-types",
    "crates/oryq-document",
    "crates/oryq-engine",
    "crates/oryq-index",
    "crates/oryq-fts",
    "crates/oryq-vec",
    "crates/oryq-query",
    "crates/oryq-core",
    "crates/oryq-ffi",
    "crates/oryq-cli",
    "xtask",
]

[workspace.package]
version = "0.15.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Ayesh Rodrigo <ayeshrodz@gmail.com>"]
repository = "https://github.com/ayeshrodz/OryqDB"

[workspace.dependencies]
oryq-types = { path = "crates/oryq-types", version = "0.15.1" }
oryq-document = { path = "crates/oryq-document", version = "0.15.1" }
oryq-engine = { path = "crates/oryq-engine", version = "0.15.1" }
oryq-index = { path = "crates/oryq-index", version = "0.15.1" }
oryq-fts = { path = "crates/oryq-fts", version = "0.15.1" }
oryq-vec = { path = "crates/oryq-vec", version = "0.15.1" }
oryq-query = { path = "crates/oryq-query", version = "0.15.1" }
oryq-core = { path = "crates/oryq-core", version = "0.15.1" }
fs4 = "0.12"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Must remain "unwind" so `oryq-ffi` `catch_unwind` panic guards work across the C ABI.
panic = "unwind"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
