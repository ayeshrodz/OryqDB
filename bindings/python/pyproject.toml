[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oryqdb"
version = "0.12.2"
description = "Official Python ctypes bindings for OryqDB (embedded single-file NoSQL document database)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ayesh Rodrigo", email = "ayeshrodz@gmail.com" }]
keywords = ["database", "nosql", "embedded", "document", "oryqdb"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oryqdb*"]
