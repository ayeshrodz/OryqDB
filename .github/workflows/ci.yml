name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy-docs:
    name: Format, Clippy, Architecture & Design Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p oryq-core -p oryq-ffi -p oryq-cli --features fts,vec --all-targets -- -D warnings

      - name: Run architecture boundary check (PR diff)
        if: github.event_name == 'pull_request'
        run: cargo run -p xtask -- architecture --base origin/${{ github.base_ref }}

      - name: Run architecture boundary check (main push)
        if: github.event_name != 'pull_request'
        run: cargo run -p xtask -- architecture

      - name: Validate design docs and prototypes
        run: python3 tools/validate_design_docs.py

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: fmt-clippy-docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

      - name: Run no-default-features tests
        run: cargo test --workspace --no-default-features

      - name: Run module check for foundation (oryq-types)
        run: cargo run -p xtask -- modules types

      - name: Run module check for document (oryq-document)
        run: cargo run -p xtask -- modules document

      - name: Run module check for engine (oryq-engine)
        run: cargo run -p xtask -- modules engine

      - name: Run module check for index (oryq-index)
        run: cargo run -p xtask -- modules index

      - name: Run module check for query (oryq-query)
        run: cargo run -p xtask -- modules query

      - name: Run module check for core (oryq-core)
        run: cargo run -p xtask -- modules core

      - name: Run module check for ffi (oryq-ffi)
        run: cargo run -p xtask -- modules ffi

      - name: Run module check for cli (oryq-cli)
        run: cargo run -p xtask -- modules cli

      - name: Run optional FTS & Vector extension tests (--features fts, vec, fts+vec)
        run: |
          cargo run -p xtask -- modules fts
          cargo run -p xtask -- modules vec
          cargo test -p oryq-core --features fts
          cargo test -p oryq-core --features vec
          cargo test -p oryq-core --features fts,vec
          cargo test -p oryq-ffi --features fts
          cargo test -p oryq-ffi --features vec
          cargo test -p oryq-ffi --features fts,vec
          cargo test -p oryq-cli --features fts
          cargo test -p oryq-cli --features vec
          cargo test -p oryq-cli --features fts,vec

      - name: Compile and run native C99/C++17 FFI integration tests & examples
        if: runner.os != 'Windows'
        run: |
          cargo build -p oryq-ffi
          TMPDIR_FFI=$(mktemp -d)
          cc -std=c99 -Wall -Wextra -Werror -Iinclude crates/oryq-ffi/tests/c99_integration.c -Ltarget/debug -loryq -Wl,-rpath,target/debug -lm -o "$TMPDIR_FFI/c99_test"
          "$TMPDIR_FFI/c99_test" "$TMPDIR_FFI/test.oryq" "$TMPDIR_FFI/backup.oryq"
          cc -std=c99 -Wall -Wextra -Werror -Iinclude bindings/c/quickstart.c -Ltarget/debug -loryq -Wl,-rpath,target/debug -lm -o "$TMPDIR_FFI/quickstart_c"
          "$TMPDIR_FFI/quickstart_c" "$TMPDIR_FFI/qs_c.oryq" "$TMPDIR_FFI/qs_c_bk.oryq"
          c++ -std=c++11 -Wall -Wextra -Werror -fsyntax-only -x c++ -Iinclude - <<< '#include "oryq.h"'
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude bindings/cpp/quickstart.cpp -Ltarget/debug -loryq -Wl,-rpath,target/debug -lm -o "$TMPDIR_FFI/quickstart_cpp"
          "$TMPDIR_FFI/quickstart_cpp" "$TMPDIR_FFI/qs_cpp.oryq"
          rm -rf "$TMPDIR_FFI"

      - name: Run Python ctypes binding tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s bindings/python/tests -v
          cargo build -p oryq-ffi --features fts,vec
          ORYQ_EXPECT_HYBRID=1 python3 -m unittest discover -s bindings/python/tests -v

      - name: Run Python ctypes binding tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build -p oryq-ffi
          python -m unittest discover -s bindings/python/tests -v
          cargo build -p oryq-ffi --features fts,vec
          $env:ORYQ_EXPECT_HYBRID = "1"
          python -m unittest discover -s bindings/python/tests -v
