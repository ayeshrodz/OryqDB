name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy-docs:
    name: Format, Clippy, Architecture & Design Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run architecture boundary check (PR diff)
        if: github.event_name == 'pull_request'
        run: cargo run -p xtask -- architecture --base origin/${{ github.base_ref }}

      - name: Run architecture boundary check (main push)
        if: github.event_name != 'pull_request'
        run: cargo run -p xtask -- architecture

      - name: Validate design docs and prototypes
        run: python3 tools/validate_design_docs.py

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: fmt-clippy-docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

      - name: Run no-default-features tests
        run: cargo test --workspace --no-default-features

      - name: Run module check for foundation (oryq-types)
        run: cargo run -p xtask -- modules types
